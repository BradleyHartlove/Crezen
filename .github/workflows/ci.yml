name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── Frontend ────────────────────────────────────────────────────────────────

  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: ESLint
        run: npm run lint

      - name: Prettier check
        run: npm run format:check

  # ── Backend (Go) ────────────────────────────────────────────────────────────

  lint-backend:
    name: Lint Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          working-directory: backend
          version: latest

  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: backend/go.sum

      - name: Run tests
        run: go test -race -count=1 ./...

  # ── WASM (Rust) ─────────────────────────────────────────────────────────────

  lint-rust:
    name: Lint WASM
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/src/wasm
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src/wasm -> target

      - name: Clippy (wasm32 target)
        run: cargo clippy --target wasm32-unknown-unknown -- -D warnings

  test-rust:
    name: Test WASM
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/src/wasm
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src/wasm -> target

      - name: Cargo test (native)
        run: cargo test

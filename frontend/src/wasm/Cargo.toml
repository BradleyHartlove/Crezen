[package]
name = "crezen-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
argon2 = { version = "0.5", features = ["std"] }
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
getrandom = { version = "0.2", features = ["js"] }
zeroize = { version = "=1.7.0", features = ["alloc"] }
base64 = "0.22"
js-sys = "0.3"

[profile.release]
opt-level = "s"
